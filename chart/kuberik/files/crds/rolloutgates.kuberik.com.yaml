---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: rolloutgates.kuberik.com
spec:
  group: kuberik.com
  names:
    kind: RolloutGate
    listKind: RolloutGateList
    plural: rolloutgates
    singular: rolloutgate
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RolloutGate is the Schema for the rolloutgates API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RolloutGateSpec defines the desired state of RolloutGate.
            properties:
              allowedVersions:
                description: AllowedVersions is a list of versions that Rollout can
                  be updated to.
                items:
                  type: string
                type: array
              appliesTo:
                default:
                - Deploy
                description: |-
                  AppliesTo says which moves the gate decides: Deploy (moving forward to a
                  new release, the only direction before this field existed) and/or Rollback
                  (an automatic rollback to an earlier build). Unset means Deploy only, so
                  existing gates are unchanged. A gate that does not list Deploy is ignored
                  when the Rollout picks its next release.
                items:
                  description: GateDirection is a kind of move a RolloutGate can decide.
                  enum:
                  - Deploy
                  - Rollback
                  type: string
                maxItems: 2
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              passing:
                default: true
                description: Passing is true if the RolloutGate is passing.
                type: boolean
              rolloutRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - passing
            - rolloutRef
            type: object
          status:
            description: RolloutGateStatus defines the observed state of RolloutGate.
            properties:
              lastHandledRefresh:
                description: |-
                  LastHandledRefresh is the refresh request the gate's controller last
                  answered: the value of the kuberik.com/refresh-requested annotation it had
                  re-evaluated the gate for. Before an automatic rollback the Rollout asks every
                  gate that carries the kuberik.com/gate-controller label and applies to
                  Rollback to refresh, and waits until this field echoes the request.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
