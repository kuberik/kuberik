                  properties:
                    created:
                      description: Created is the creation timestamp extracted from
                        OCI annotations if available.
                      format: date-time
                      type: string
                    digest:
                      description: Digest is the image digest if available from the
                        ImagePolicy.
                      type: string
                    metadataUnresolved:
                      description: |-
                        MetadataUnresolved is true when this release's OCI manifest could not be
                        read, so Requires and the version fields say nothing about the image.
                        A RolloutDependency blocks such a release rather than reading the absent
                        annotations as "declares no requirement", which would open the gate
                        whenever the registry is unreachable.
                      type: boolean
                    requires:
                      additionalProperties:
                        type: string
                      description: |-
                        Requires maps a contract name to what this release requires of that
                        contract, extracted from "com.kuberik.rollout.requires.<contract>" OCI
                        annotations. Values are version constraints as defined by
                        github.com/Masterminds/semver, applied verbatim — note that a bare version
                        is an exact match there, not a floor.
                        RolloutDependency uses these to gate this release on the deployed version of
                        the Rollout providing each contract.

                        Bounded because it is populated from image annotations, which are outside
                        this controller's trust boundary, and is stored on every release and every
                        history entry.
                      maxProperties: 32
                      type: object
                    revision:
                      description: Revision is the revision information extracted
                        from OCI annotations if available.
                      type: string
                    tag:
                      description: Tag is the image tag (e.g., "v1.2.3", "latest").
                      type: string
                    version:
                      description: Version is the semantic version extracted from
                        OCI annotations if available.
                      type: string
                  required:
                  - tag
                  type: object
                type: array
              releaseSource:
                description: ReleaseSource summarises the ReleaseSource this Rollout
                  reads (slices mode only).
                properties:
                  count:
                    description: Count is the number of releases in the catalogue.
                    format: int32
                    type: integer
                  name:
                    description: Name of the ReleaseSource.
                    type: string
                  newest:
                    description: Newest is the tag of the newest release in the catalogue.
                    type: string
                  observedAt:
                    description: ObservedAt is when name, ready, count or newest last
                      changed.
                    format: date-time
                    type: string
                  ready:
                    description: Ready mirrors the ReleaseSource Ready condition.
                    type: boolean
                required:
                - name
                - ready
                type: object
              source:
                description: |-
                  Source is the source information extracted from OCI annotations.
                  This typically contains the repository URL or source code location.
                  This field is set once for the entire rollout based on the latest available release.
                type: string
              title:
                description: |-
                  Title is the title of the image extracted from OCI annotations.
                  This field is set once for the entire rollout based on the latest available release.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
