                      type: string
                    tag:
                      description: Tag is the image tag (e.g., "v1.2.3", "latest").
                      type: string
                    version:
                      description: Version is the semantic version extracted from
                        OCI annotations if available.
                      type: string
                  required:
                  - tag
                  type: object
                type: array
              candidates:
                description: |-
                  Candidates is the working set in slices mode: the K newest releases newer
