                          type: string
                        tag:
                          description: Tag is the image tag (e.g., "v1.2.3", "latest").
                          type: string
                        version:
                          description: Version is the semantic version extracted from
                            OCI annotations if available.
                          type: string
                      required:
                      - tag
                      type: object
                  required:
                  - timestamp
                  - version
                  type: object
                type: array
              releaseCandidates:
                description: |-
