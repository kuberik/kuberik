                      type: string
                    tag:
                      description: Tag is the image tag (e.g., "v1.2.3", "latest").
                      type: string
                    version:
                      description: Version is the semantic version extracted from
                        OCI annotations if available.
                      type: string
                  required:
                  - tag
                  type: object
                type: array
              gates:
                description: Gates summarizes the status of each gate relevant to
                  this rollout.
                items:
                  description: RolloutGateStatusSummary summarizes the status of a
                    gate relevant to this rollout.
                  properties:
                    allowedVersions:
                      description: AllowedVersions is a list of versions that are
                        allowed by the gate.
                      items:
                        type: string
                      type: array
                    bypassGates:
                      description: BypassGates indicates whether this gate was bypassed
                        for the current deployment.
                      type: boolean
                    message:
                      description: Message is a message describing the status of the
                        gate.
                      type: string
                    name:
                      description: Name is the name of the gate.
                      type: string
                    passing:
                      description: Passing is true if the gate is passing, false if
                        it is blocking.
                      type: boolean
                  required:
                  - name
                  type: object
                type: array
              history:
                description: |-
                  History tracks the deployment history of this Rollout.
                  Each entry contains the version deployed and the timestamp of the deployment.
                items:
                  description: DeploymentHistoryEntry represents a single entry in
                    the deployment history.
                  properties:
                    approval:
                      description: |-
                        Approval names the RolloutApproval that let this build through an
                        approval gate. Nil when no approval gate applied, or when gates were bypassed.
                      properties:
                        by:
                          description: By is the approval.kuberik.com/by annotation
                            at deploy time, if set.
                          type: string
                        name:
                          description: Name of the RolloutApproval, in the Rollout's
                            namespace.
                          type: string
                      required:
                      - name
                      type: object
                    bakeEndTime:
                      description: |-
                        BakeEndTime is the time when the bake period ended for this deployment
                        This is when the bake process completed (either successfully or with failure).
                      format: date-time
                      type: string
                    bakeStartTime:
                      description: |-
                        BakeStartTime is the time when the bake period started for this deployment
                        This is when the rollout controller began monitoring the deployment for stability.
                      format: date-time
                      type: string
                    bakeStatus:
                      description: |-
                        BakeStatus tracks the bake state for this deployment (e.g., None, InProgress, Succeeded, Failed, Cancelled)
                        The bake process ensures that the deployment is stable and healthy before marking as successful.
                      type: string
                    bakeStatusMessage:
                      description: |-
                        BakeStatusMessage provides details about the bake state for this deployment
                        This field contains human-readable information about why the bake status is what it is.
                      type: string
                    failedHealthChecks:
                      description: |-
                        FailedHealthChecks contains all health checks that failed during bake.
                        This field is populated when bake fails due to health check errors.
                      items:
                        description: FailedHealthCheck represents a health check that
                          failed during bake.
                        properties:
                          message:
                            description: Message is the error message from the health
                              check.
                            type: string
                          name:
                            description: Name is the name of the health check.
                            type: string
                          namespace:
                            description: Namespace is the namespace of the health
                              check.
                            type: string
                          observations:
                            description: |-
                              Observations is a snapshot of the health check's status.observations taken
                              when the failure was recorded. It is not updated afterwards, so the figure
                              survives the health check recovering.
                            items:
                              description: |-
                                HealthCheckObservation is one typed fact a health check evaluated.
                                Numeric fields are decimal strings (e.g. "8.2", "0.082") so no precision is lost
                                and the CRD stays float-free.
                              properties:
                                direction:
                                  description: 'Direction, for Threshold: Above is
                                    bad when value > limit; Below is bad when value
                                    < limit.'
                                  enum:
                                  - Above
                                  - Below
                                  type: string
                                healthy:
                                  description: |-
                                    Healthy says whether this observation alone is within bounds, so a consumer
                                    can mark the offending one when several are listed.
                                  type: boolean
                                kind:
                                  description: |-
                                    Kind picks the drawing: Threshold (value vs limit), Ratio (value of total),
                                    Count (value), State (no number; label only).
                                  enum:
                                  - Threshold
                                  - Ratio
                                  - Count
                                  - State
                                  type: string
                                limit:
                                  description: Limit is the boundary for a Threshold
                                    observation, as a decimal string.
                                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                                  type: string
                                name:
                                  description: Name of the observed quantity, shown
                                    as the label ("error rate", "p99 latency").
                                  minLength: 1
                                  type: string
                                observedTime:
                                  description: ObservedTime is when the provider last
                                    evaluated this observation.
                                  format: date-time
                                  type: string
                                total:
                                  description: Total is the denominator for a Ratio
                                    observation, as a decimal string.
                                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                                  type: string
                                unit:
                                  description: 'Unit of the numbers: Percent (a ratio
                                    0..1), Milliseconds, Seconds, Count, or free text.'
                                  type: string
                                value:
                                  description: Value is the observed number, as a
                                    decimal string.
                                  pattern: ^-?[0-9]+(\.[0-9]+)?$
                                  type: string
                                window:
                                  description: Window the observation covers, e.g.
                                    "5m".
                                  type: string
                              required:
                              - kind
                              - name
                              type: object
                            maxItems: 16
                            type: array
                        required:
                        - name
                        - namespace
                        type: object
                      type: array
                    id:
                      description: ID is a unique auto-incrementing identifier for
                        this history entry.
                      format: int64
                      type: integer
                    lastRetryTimestamp:
                      description: |-
                        LastRetryTimestamp is the time when a retry was most recently requested for this deployment.
                        When set, downstream controllers (health checks, kruise rollout step gates) use this as a
                        cutoff: stale failure conditions with LastTransitionTime older than LastRetryTimestamp are
                        ignored as they reflect the pre-retry state.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        Message provides a descriptive message about this deployment entry
                        This field contains human-readable information about the deployment context.
                        For automatic deployments, it includes information about gate bypass and failed bake unblock.
                        For manual deployments (when wantedVersion is specified), it can contain a custom message
                        provided via the "rollout.kuberik.com/deployment-message" annotation, or defaults to "Manual deployment".
                      type: string
                    timestamp:
                      description: Timestamp is the time when the deployment occurred.
                      format: date-time
                      type: string
                    triggeredBy:
                      description: |-
                        TriggeredBy indicates what triggered this deployment.
                        Kind can be "User" for manual deployments triggered by a user, or "System" for automatic deployments.
                        Name contains the name of the user or system that triggered the deployment.
                        For user-triggered deployments, this is extracted from the "rollout.kuberik.com/deploy-user" annotation.
                        For system-triggered deployments, this is typically "rollout-controller".
                      properties:
                        kind:
                          description: |-
                            Kind indicates the type of trigger: "User" for manual deployments triggered by a user,
                            or "System" for automatic deployments triggered by the rollout controller.
                          enum:
                          - User
                          - System
                          type: string
                        name:
                          description: |-
                            Name contains the name of the user or system that triggered the deployment.
                            For user-triggered deployments, this is extracted from the "rollout.kuberik.com/deploy-user" annotation.
                            For system-triggered deployments, this is typically "rollout-controller".
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    version:
                      description: Version is the version information that was deployed.
                      properties:
                        created:
                          description: Created is the creation timestamp extracted
                            from OCI annotations if available.
                          format: date-time
                          type: string
                        digest:
                          description: Digest is the image digest if available from
                            the ImagePolicy.
                          type: string
                        metadataUnresolved:
                          description: |-
                            MetadataUnresolved is true when this release's OCI manifest could not be
                            read, so Requires and the version fields say nothing about the image.
                            A RolloutDependency blocks such a release rather than reading the absent
                            annotations as "declares no requirement", which would open the gate
                            whenever the registry is unreachable.
                          type: boolean
                        requires:
                          additionalProperties:
                            type: string
                          description: |-
                            Requires maps a contract name to what this release requires of that
                            contract, extracted from "com.kuberik.rollout.requires.<contract>" OCI
                            annotations. Values are version constraints as defined by
                            github.com/Masterminds/semver, applied verbatim — note that a bare version
                            is an exact match there, not a floor.
                            RolloutDependency uses these to gate this release on the deployed version of
