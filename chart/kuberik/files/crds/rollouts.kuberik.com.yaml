                  If not specified, the rollout will wait indefinitely for bake to start.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              healthCheckSelector:
                description: HealthCheckSelector specifies how to select HealthChecks
