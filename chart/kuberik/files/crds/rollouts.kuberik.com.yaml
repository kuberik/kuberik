                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  selector:
                    description: Selector specifies the label selector for matching
                      HealthChecks
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              releaseSourceRef:
                description: |-
                  ReleaseSourceRef names a ReleaseSource (kuberik.com, served by release-controller)
                  in the same namespace that provides this Rollout's releases. When set (and the
                  release-controller CRDs are installed) the Rollout reads its releases from the
                  source's ReleaseSlice catalogue. This is the only release path: a Rollout
                  without it gets no releases and reports ReleasesUpdated=False and Ready=False
                  with reason ReleaseSourceRequired.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              releasesImagePolicy:
                description: |-
                  Deprecated: ignored; removed in the next release. Releases come from
                  releaseSourceRef; to migrate an existing Flux ImagePolicy, create a
                  ReleaseSource with spec.oci.imagePolicyRef. A Rollout that sets it reports
                  ReleasesImagePolicyIgnored=True.
                  A value type, so Go clients always send "releasesImagePolicy: {}".
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              versionHistoryLimit:
                default: 10
                description: VersionHistoryLimit defines the maximum number of entries
                  to keep in the deployment history
                format: int32
                minimum: 1
                type: integer
              wantedVersion:
                description: WantedVersion specifies a specific version to deploy,
                  overriding the automatic version selection
                type: string
            type: object
          status:
            description: RolloutStatus defines the observed state of Rollout.
            properties:
              artifactType:
                description: |-
                  ArtifactType is the media/artifact type of the image extracted from the manifest.
                  This includes OCI artifact types, container image types, and other media types.
                  This field is set once for the entire rollout based on the latest available release.
                type: string
              availableReleases:
                description: |-
                  Deprecated: ignored; no longer written (cleared on reconcile). Read
                  status.candidates and the ReleaseSlice catalogue instead. Removed in the next release.
                  AvailableReleases is a list of all releases available in the releases repository.
                items:
                  description: VersionInfo represents detailed information about a
                    version.
                  properties:
                    created:
                      description: Created is the creation timestamp extracted from
                        OCI annotations if available.
                      format: date-time
                      type: string
                    digest:
                      description: Digest is the image digest if available from the
                        ImagePolicy.
                      type: string
                    metadataUnresolved:
                      description: |-
                        MetadataUnresolved is true when this release's OCI manifest could not be
                        read, so Requires and the version fields say nothing about the image.
                        A RolloutDependency blocks such a release rather than reading the absent
                        annotations as "declares no requirement", which would open the gate
                        whenever the registry is unreachable.
                      type: boolean
                    requires:
                      additionalProperties:
                        type: string
                      description: |-
                        Requires maps a contract name to what this release requires of that
                        contract, extracted from "com.kuberik.rollout.requires.<contract>" OCI
                        annotations. Values are version constraints as defined by
                        github.com/Masterminds/semver, applied verbatim — note that a bare version
                        is an exact match there, not a floor.
                        RolloutDependency uses these to gate this release on the deployed version of
                        the Rollout providing each contract.

                        Bounded because it is populated from image annotations, which are outside
                        this controller's trust boundary, and is stored on every release and every
                        history entry.
                      maxProperties: 32
                      type: object
                    revision:
                      description: Revision is the revision information extracted
