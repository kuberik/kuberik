{{- if .Values.rolloutController.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-controller-manager
  namespace: {{ .Values.namespace }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
{{ toYaml . | indent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-leader-election-role
  namespace: {{ .Values.namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-healthcheck-editor-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - healthchecks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - healthchecks/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-healthcheck-viewer-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - healthchecks
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - healthchecks/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-controller-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - '*'
  - namespaces
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - image.toolkit.fluxcd.io
  resources:
  - imagepolicies
  - imagerepositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - clusterrolloutschedules
  - healthchecks
  - kustomizationhealths
  - rolloutdependencies
  - rolloutgates
  - rollouts
  - rolloutschedules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - clusterrolloutschedules/finalizers
  - healthchecks/finalizers
  - kustomizationhealths/finalizers
  - rolloutdependencies/finalizers
  - rollouts/finalizers
  - rolloutschedules/finalizers
  verbs:
  - update
- apiGroups:
  - kuberik.com
  resources:
  - clusterrolloutschedules/status
  - healthchecks/status
  - kustomizationhealths/status
  - rolloutdependencies/status
  - rollouts/status
  - rolloutschedules/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kuberik.com
  resources:
  - approvalpolicies
  - clusterapprovalpolicies
  - rolloutapprovals
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - approvalpolicies/finalizers
  - clusterapprovalpolicies/finalizers
  verbs:
  - update
- apiGroups:
  - kuberik.com
  resources:
  - approvalpolicies/status
  - clusterapprovalpolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - ocirepositories
  verbs:
  - get
  - list
  - patch
  - update
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-controller-metrics-auth-role
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-controller-metrics-reader
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-rollout-admin-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - rollouts
  verbs:
  - '*'
- apiGroups:
  - kuberik.com
  resources:
  - rollouts/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-rollout-editor-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - rollouts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - rollouts/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-rollout-viewer-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - rollouts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - rollouts/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-rolloutgate-editor-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - rolloutgates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - rolloutgates/status
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-rolloutgate-viewer-role
rules:
- apiGroups:
  - kuberik.com
  resources:
  - rolloutgates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kuberik.com
  resources:
  - rolloutgates/status
  verbs:
  - get
---
# Explicit binding only: deliberately not aggregated into edit/admin, so
# editing a namespace does not imply approving its builds. Bind it with a
# RoleBinding per namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: kuberik-rollout-approver
rules:
- apiGroups:
  - kuberik.com
  resources:
  - rolloutapprovals
  verbs:
  - get
  - list
  - watch
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-leader-election-rolebinding
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-controller-leader-election-role
subjects:
- kind: ServiceAccount
  name: rollout-controller-controller-manager
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: rollout-controller
  name: rollout-controller-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-controller-manager-role
subjects:
- kind: ServiceAccount
  name: rollout-controller-controller-manager
  namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-controller-metrics-auth-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-controller-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: rollout-controller-controller-manager
  namespace: {{ .Values.namespace }}
{{- end }}
