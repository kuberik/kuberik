# Default values for the kuberik Helm chart.

# Namespace where the rollout-controller is installed.
namespace: kuberik-system

# Have the chart emit the Namespace manifest. Set to false if you use
# `helm install --create-namespace` (helm owns the namespace then) or
# if the namespace is managed outside the chart.
createNamespace: true

# Pod Security Admission labels applied to the chart-managed Namespace.
# All three modes (enforce/audit/warn) accept "privileged", "baseline",
# or "restricted". The controllers run as non-root with read-only
# rootfs and dropped capabilities, so "restricted" is the safe choice.
podSecurityAdmission:
  enforce: ""  # e.g. "restricted"
  audit: ""
  warn: ""
  version: ""  # e.g. "v1.31"; leaves cluster default if empty

# Core rollout-controller settings. Always installed.
rolloutController:
  enabled: true
  image:
    repository: ghcr.io/kuberik/rollout-controller
    # Defaults to the chart's appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceAccount:
    name: rollout-controller
    annotations: {}
  replicas: 1
  logLevel: info
  podDisruptionBudget:
    # Only emitted when enabled AND replicas > 1. Provide either
    # minAvailable or maxUnavailable; if both unset, defaults to
    # minAvailable: 1.
    enabled: false
    minAvailable: ""
    maxUnavailable: ""
  # Scheduling controls for the rollout-controller pods.
  priorityClassName: ""
  topologySpreadConstraints: []
  # Extra command-line args appended to /manager. Examples:
  #   - "--reconcile-interval=30s"
  #   - "--leader-elect-lease-duration=15s"
  extraArgs: []
  # Extra environment variables for the manager container. Standard
  # corev1.EnvVar shape - supports valueFrom: { secretKeyRef|configMapKeyRef }.
  extraEnv: []

# Prometheus Operator ServiceMonitor for scraping controller metrics.
metrics:
  serviceMonitor:
    enabled: false
    # Namespace where the ServiceMonitor is created; defaults to .Values.namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Optional integration controllers. Enable the ones you need.
integrations:
  datadog:
    enabled: false
    image:
      repository: ghcr.io/kuberik/datadog-controller
      tag: ""  # defaults to the version pinned by the template
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 128Mi }
  prometheus:
    enabled: false
    image:
      repository: ghcr.io/kuberik/prometheus-controller
      tag: ""
  openkruise:
    enabled: false
    image:
      repository: ghcr.io/kuberik/openkruise-controller
      tag: ""
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 128Mi }
  environment:
    enabled: false
    image:
      repository: ghcr.io/kuberik/environment-controller
      tag: ""
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits:   { cpu: 500m, memory: 128Mi }

# Optional dashboard (rollout-dashboard web UI).
dashboard:
  enabled: false
  image:
    repository: ghcr.io/kuberik/rollout-dashboard
    tag: ""
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  # Multi-cluster fan-out. The dashboard auto-discovers spoke URLs from
  # Environment.status.environmentInfos[].environmentUrl — no config needed
  # for zero-config discovery. Set these to assist self-identification behind
  # reverse proxies or to designate this instance as a spoke.
  # When any field is set the chart creates a kuberik-cluster-info ConfigMap.
  clusterName: ""  # Display name shown in the hub UI (derived from url when empty)
  url: ""          # External base URL of this dashboard; e.g. https://dashboard.example.com
  hubUrl: ""       # Hub dashboard URL. When set this instance acts as a spoke and
                   # redirects UI traffic to the hub.
  insecureSkipTLSVerify: false  # Skip TLS for hub→spoke calls (dev / self-signed only)
  ingress:
    enabled: false
    # Required when enabled. e.g. "dashboard.kuberik.example.com"
    host: ""
    # IngressClass name; leave empty to use the cluster default.
    className: ""
    path: /
    pathType: Prefix
    # The Service port the Ingress backend targets (the dashboard listens
    # on the port declared by its upstream Service - usually 80 or 3000).
    servicePort: 80
    annotations: {}
    # tls is passed verbatim to spec.tls. Example:
    #   tls:
    #     - hosts: [dashboard.kuberik.example.com]
    #       secretName: dashboard-tls
    tls: []
  # Gateway API alternative to .ingress. Emits an HTTPRoute (and, when
  # gateway.auth is true and the cluster auth gate is enabled below, a
  # SecurityPolicy that gates the dashboard via oauth2-proxy).
  # Mutually exclusive with .ingress.
  gateway:
    enabled: false
    parentRef:
      # Gateway to attach the HTTPRoute to. e.g. name: eg, namespace: envoy-gateway-system
      name: ""
      namespace: ""
    # Hostname the dashboard serves at. e.g. "dashboard.kuberik.example.com"
    hostname: ""
    # When true, also emit a SecurityPolicy that routes every request
    # through .Values.auth.* via extAuth. Requires auth.enabled.
    auth: false

# Cluster-level OIDC auth gate. Installs oauth2-proxy in its own namespace
# as shared infrastructure; any HTTPRoute (the dashboard above, plus anything
# else you put on the same Gateway) can opt in via a SecurityPolicy that
# references it through the ReferenceGrants emitted alongside.
#
# The auth gate is dashboard-agnostic - oauth2-proxy never sees upstream
# backends. To put the dashboard behind it, also set:
#   dashboard.gateway.enabled: true
#   dashboard.gateway.auth: true
auth:
  enabled: false
  # Namespace for the shared auth infrastructure. Defaults to auth-system.
  namespace: auth-system
  # Have the chart emit the auth namespace. Set false if you manage it
  # outside the chart (Argo CD, separate kustomize, etc.).
  createNamespace: true
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.7.1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  # OIDC client config. The same clientId should also be configured as
  # kube-apiserver's --oidc-client-id so the dashboard's id_token authenticates
  # against both oauth2-proxy and the API server with one audience.
  oidc:
    issuerUrl: ""              # e.g. https://your-idp.example.com
    clientId: kuberik-cluster
    # Either set clientSecret inline (NOT recommended for production - it
    # ends up in the rendered manifest) or point to an existing Secret with
    # `client-secret` and `cookie-secret` keys.
    clientSecret: ""
    existingSecret: ""
    # Extra OAuth2 scopes appended to "openid email profile groups".
    extraScopes: []
    # Restrict accepted email domains. Use ["*"] for any.
    emailDomains: ["*"]
    # Trust the OIDC provider's CA (when self-signed). Provide the name of
    # a ConfigMap in .Values.auth.namespace with a `ca.crt` key.
    providerCaConfigMap: ""
  # Canonical host that owns the OAuth2 callback URI - the only one the
  # OIDC provider needs registered as a redirect URI. All gated subdomains
  # share the session via .cookieDomain.
  canonicalHost: ""
  # Cookie scope. Defaults to canonicalHost. Set to a parent domain
  # (".example.com") so subdomains share the session.
  cookieDomain: ""
  # The Gateway the /oauth2/* HTTPRoute attaches to. Usually the same one
  # the dashboard uses. The HTTPRoute matches on every gateway hostname
  # so the 302 redirect lands on whichever subdomain triggered the flow.
  gateway:
    name: ""
    namespace: ""
  # Namespaces whose SecurityPolicies are allowed to extAuth-reference
  # oauth2-proxy in this namespace. Emits one ReferenceGrant per entry.
  # The chart auto-adds .Values.namespace when dashboard.gateway.auth is true.
  allowedConsumerNamespaces: []
  # Accept JWT bearer tokens signed by the configured issuer without a
  # session cookie. Required for multi-cluster hub->spoke fan-out and any
  # programmatic caller that already holds an id_token.
  skipJwtBearerTokens: true
  # Path regexes answered with 401 instead of a redirect to the IdP.
  #
  # The dashboard is a polling SPA (5s refresh interval, plus an SSE change
  # stream). Without this, every background request that arrives with a stale
  # session starts a full OIDC flow at extAuth time - a 302 to the IdP plus a
  # CSRF cookie holding a fresh PKCE verifier. The browser cannot follow that
  # redirect from an XHR (cross-origin, CORS-blocked), so the SPA never
  # recovers and just keeps polling, starting another flow each time.
  #
  # Two things go wrong as a result. Concurrent flows race over the CSRF
  # cookie and produce `invalid_grant: PKCE verification failed` on login
  # (oauth2-proxy#2155). And if you reach for `--cookie-csrf-per-request` to
  # fix that race, each flow gets a *uniquely named* cookie the browser never
  # overwrites - they accumulate until the `Cookie` header exceeds the proxy's
  # header cap (60 KiB in Envoy) and the host stops loading entirely for that
  # browser until site data is cleared.
  #
  # Answering /api/* with 401 removes the cause: no background flows, nothing
  # to race, no cookies minted. Browser navigations still redirect normally.
  # Set to [] to restore the old behaviour.
  apiRoutes:
    - "^/api/"
  # Extra command-line args appended to oauth2-proxy. Useful for tweaks
  # like --whitelist-domain, --upstream-timeout, etc.
  extraArgs: []

# Common pod settings applied to all controllers.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}

# Labels and annotations merged into every chart-managed resource. Useful
# for cost-allocation tags, multi-tenant identifiers, GitOps source labels,
# etc. Integration-controller resources vendored from upstream releases
# are NOT affected (their labels stay matching the upstream selectors).
commonLabels: {}
commonAnnotations: {}

# imagePullSecrets attached to the rollout-controller ServiceAccount.
# Use this when the controller image lives in a private registry.
# Integration controllers have their own SAs - attach secrets to those
# separately via kubectl patch.
imagePullSecrets: []
# Example:
# imagePullSecrets:
#   - name: my-registry-creds

# Settings for `helm test` resources.
tests:
  # ServiceAccount the helm test pod runs under. Defaults to the
  # rollout-controller's SA, which already has list-deployment access
  # via the manager ClusterRole. Override if you want isolation.
  serviceAccountName: ""

# Hardened NetworkPolicy for the controller pods. Off by default - turn
# on for clusters where namespace ingress/egress is restricted.
networkPolicy:
  enabled: false
  # Override the metrics-scrape source. Default allows scraping from any
  # namespace; tighten to a specific Prometheus namespace label in prod.
  metricsScrapeFrom: []
  # Extra egress rules (list of NetworkPolicyEgressRule) appended verbatim.
  extraEgress: []
