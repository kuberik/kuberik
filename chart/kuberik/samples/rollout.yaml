# Sample Rollout: tracks one ReleaseSource with a 10-minute bake window.
# Needs the release-controller (on by default in the chart).
# kubectl apply -f releasesource.yaml -f rollout.yaml
---
apiVersion: kuberik.com/v1alpha1
kind: Rollout
metadata:
  name: my-app
  namespace: default
spec:
  releaseSourceRef:
    name: my-app
  versionHistoryLimit: 10
  bakeTime: 10m
