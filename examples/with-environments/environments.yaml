# Multi-environment promotion: production proceeds only after staging.
#
# Both Environments use the same spec.name. They are told apart by
# spec.environment, a tier with a fixed order: dev, test, staging, prod
# (aliases such as "production" are accepted). environment-controller
# gates each Environment on the nearest earlier tier that exists in
# GitHub for the same name, by writing a RolloutGate on the Rollout.
# There is no per-object ordering field.
#
# Requires environment-controller installed (helm: integrations.environment.enabled=true).
---
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: my-app-staging
  namespace: staging
spec:
  rolloutRef:
    name: my-app
  name: my-app
  environment: staging
  backend:
    type: github
    project: myorg/my-app
    secret: github-token
---
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: my-app-production
  namespace: production
spec:
  rolloutRef:
    name: my-app
  name: my-app
  environment: production
  backend:
    type: github
    project: myorg/my-app
    secret: github-token
