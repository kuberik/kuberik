# A minimal Kuberik rollout that reads releases from the ReleaseSource
# my-app (release-source.yaml) and promotes each one through a 10-minute
# bake period.
#
# Requires:
#   - release-controller installed, for the ReleaseSource
#   - Flux v2.6 or later with source-controller and kustomize-controller
#     (image-reflector-controller is not needed)
---
apiVersion: kuberik.com/v1alpha1
kind: Rollout
metadata:
  name: my-app
  namespace: default
spec:
  releaseSourceRef:
    name: my-app
  versionHistoryLimit: 10
  bakeTime: 10m
