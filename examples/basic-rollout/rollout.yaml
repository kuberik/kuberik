# A minimal Kuberik rollout that tracks releases of a single image and
# promotes them through a 10-minute bake period.
#
# Requires the release-controller (installed by the kuberik chart by
# default) and the ReleaseSource in releasesource.yaml.
---
apiVersion: kuberik.com/v1alpha1
kind: Rollout
metadata:
  name: my-app
  namespace: default
spec:
  releaseSourceRef:
    name: my-app
  versionHistoryLimit: 10
  bakeTime: 10m
