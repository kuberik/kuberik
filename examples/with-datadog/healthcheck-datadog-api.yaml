# A HealthCheck that polls the Datadog API directly for monitor status.
# No Datadog Operator or DatadogMonitor CRD required.
#
# The class `datadog` is Unhealthy while any selected monitor is alerting.
# Monitors are selected by ID and/or tags.
#
# Requires:
#   - datadog-controller installed (kubectl apply -k https://github.com/kuberik/kuberik/config/install)
#   - Datadog credentials for the whole cluster, in a Secret in the
#     controller's namespace (keys api-key, app-key, optional site):
#       kubectl -n kuberik-system create secret generic datadog-credentials \
#         --from-literal=api-key=YOUR_API_KEY --from-literal=app-key=YOUR_APP_KEY
#     Without credentials the HealthCheck stays Pending.
---
apiVersion: kuberik.com/v1alpha1
kind: HealthCheck
metadata:
  name: my-app-error-rate
  namespace: production
  labels:
    # The Rollout's spec.healthCheckSelector matches on this label.
    app: my-app
  annotations:
    # Explicit monitor IDs (from the Datadog UI or API), and/or monitors carrying all these tags:
    healthcheck.kuberik.com/datadog-monitor-ids: "12345678"
    # healthcheck.kuberik.com/datadog-monitor-tags: "slo:http-success,env:prod"
    # For monitors grouped by service, only count the service:my-app group:
    # healthcheck.kuberik.com/datadog-group-tags: "service:my-app"
    # healthcheck.kuberik.com/requeue-interval: "60s"
spec:
  class: datadog
