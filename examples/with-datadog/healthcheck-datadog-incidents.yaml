# A HealthCheck that goes unhealthy while an open Datadog incident matches
# this search query - independent of any specific monitor. Useful for
# blocking rollouts during an active incident.
#
# Requires:
#   - datadog-controller installed (kubectl apply -k https://github.com/kuberik/kuberik/config/install)
#   - Datadog credentials for the whole cluster, in a Secret in the
#     controller's namespace (keys api-key, app-key; the app key needs
#     the incident_read scope):
#       kubectl -n kuberik-system create secret generic datadog-credentials \
#         --from-literal=api-key=YOUR_API_KEY --from-literal=app-key=YOUR_APP_KEY
---
apiVersion: kuberik.com/v1alpha1
kind: HealthCheck
metadata:
  name: payments-incidents-check
  namespace: production
  labels:
    app: my-app
  annotations:
    # Appended to "state:(active OR stable) AND ". Facets joined with AND;
    # parentheses only around one facet's values.
    healthcheck.kuberik.com/datadog-incident-query: "services:payments AND severity:(SEV-1 OR SEV-2)"
    # healthcheck.kuberik.com/requeue-interval: "60s"
spec:
  class: datadog-incidents
