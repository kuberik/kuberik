name: e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cli-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build kuberik CLI
        run: go build -o bin/kuberik ./cmd/kuberik

      - name: Add CLI to PATH
        run: echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Print CLI version
        run: kuberik version

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kuberik-e2e

      - name: Install Flux (image-reflector required by rollout-controller)
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux install \
            --components=source-controller,kustomize-controller,image-reflector-controller \
            --network-policy=false

      - name: Install Kuberik via CLI
        run: kuberik install

      - name: Check Kuberik
        run: |
          # Give the controller a moment to come up
          kubectl wait --for=condition=Available --timeout=120s \
            deployment -n kuberik-system -l app.kubernetes.io/name=rollout-controller || true
          kuberik check

      - name: Smoke test get commands
        run: |
          kuberik get rollouts -A
          kuberik get gates -A
          kuberik get healthchecks -A

      - name: Apply a Rollout and Gate, exercise CLI
        run: |
          set -euo pipefail
          kubectl create namespace e2e
          kuberik init rollout --name e2e-app -n e2e > /tmp/ro.yaml
          kuberik init gate --name e2e-gate --rollout e2e-app -n e2e > /tmp/gate.yaml
          kubectl apply -f /tmp/ro.yaml
          kubectl apply -f /tmp/gate.yaml

      - name: Verify the controller observes them
        run: |
          set -euo pipefail
          # Rollout must exist and be reconciled (status object populated).
          # tree command should list the gate we just created.
          kubectl get rollout e2e-app -n e2e -o yaml
          kuberik tree e2e-app -n e2e | tee /tmp/tree.txt
          grep -q 'RolloutGate/e2e-gate' /tmp/tree.txt

      - name: Exercise approve/reject/suspend/resume
        run: |
          set -euo pipefail
          kuberik approve e2e-gate -n e2e
          kubectl get rolloutgate e2e-gate -n e2e -o jsonpath='{.spec.passing}' | grep -q true
          kuberik reject e2e-gate -n e2e
          kubectl get rolloutgate e2e-gate -n e2e -o jsonpath='{.spec.passing}' | grep -q false
          kuberik suspend e2e-app -n e2e
          kubectl get rollout e2e-app -n e2e -o jsonpath='{.metadata.annotations.rollout\.kuberik\.com/suspended}' | grep -q true
          kuberik resume e2e-app -n e2e
