name: e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cli-on-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build kuberik CLI
        run: go build -o bin/kuberik ./cmd/kuberik

      - name: Add CLI to PATH
        run: echo "${{ github.workspace }}/bin" >> "$GITHUB_PATH"

      - name: Print CLI version
        run: kuberik version

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kuberik-e2e

      - name: Install Flux (image-reflector required by rollout-controller)
        run: |
          curl -s https://fluxcd.io/install.sh | sudo bash
          flux install \
            --components=source-controller,kustomize-controller,image-reflector-controller \
            --network-policy=false

      - name: Install Kuberik via CLI
        run: kuberik install

      - name: Check Kuberik
        run: |
          # Give the controller a moment to come up
          kubectl wait --for=condition=Available --timeout=120s \
            deployment -n kuberik-system -l app.kubernetes.io/name=rollout-controller || true
          kuberik check

      - name: Smoke test get commands
        run: |
          kuberik get rollouts -A
          kuberik get gates -A
          kuberik get healthchecks -A

      - name: Apply a Rollout and Gate, exercise CLI
        run: |
          set -euo pipefail
          kubectl create namespace e2e
          kuberik init rollout --name e2e-app -n e2e > /tmp/ro.yaml
          kuberik init gate --name e2e-gate --rollout e2e-app -n e2e > /tmp/gate.yaml
          kubectl apply -f /tmp/ro.yaml
          kubectl apply -f /tmp/gate.yaml

      - name: Verify the controller observes them
        run: |
          set -euo pipefail
          # Rollout must exist and be reconciled (status object populated).
          # tree command should list the gate we just created.
          kubectl get rollout e2e-app -n e2e -o yaml
          kuberik tree e2e-app -n e2e | tee /tmp/tree.txt
          grep -q 'RolloutGate/e2e-gate' /tmp/tree.txt

      - name: Exercise approve/revoke
        run: |
          set -euo pipefail
          # No rollout-controller release ships the RolloutApproval CRD yet, and
          # the pinned install bundle (v0.9.2) predates it, so apply it from a
          # pinned main commit. Drop this once a release includes it.
          kubectl apply --server-side -f https://raw.githubusercontent.com/kuberik/rollout-controller/b4fd4aaa23b034c3ac8dd9adc7cb530d18511b02/config/crd/bases/kuberik.com_rolloutapprovals.yaml
          kubectl wait --for=condition=Established --timeout=60s crd/rolloutapprovals.kuberik.com
          kuberik approve e2e-app v1.2.3 -n e2e
          kuberik approve e2e-app v1.2.3 -n e2e
          kubectl get rolloutapproval e2e-app-v1-2-3 -n e2e -o jsonpath='{.spec.version}' | grep -q v1.2.3
          kubectl get rolloutapproval e2e-app-v1-2-3 -n e2e -o jsonpath='{.metadata.ownerReferences[0].name}' | grep -q e2e-app
          kuberik revoke e2e-app v1.2.3 -n e2e
          kuberik revoke e2e-app v1.2.3 -n e2e
          ! kubectl get rolloutapproval e2e-app-v1-2-3 -n e2e
