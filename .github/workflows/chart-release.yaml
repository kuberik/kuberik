name: chart-release
on:
  push:
    branches: [main]
    paths:
      - 'chart/**'
      - '.github/workflows/chart-release.yaml'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Run chart-releaser (gh-pages helm repo)
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: chart
          mark_as_latest: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart to OCI registry
        id: oci-push
        run: |
          set -euo pipefail
          version=$(grep '^version:' chart/kuberik/Chart.yaml | awk '{print $2}')
          helm package chart/kuberik --destination /tmp/cr
          if helm show chart "oci://ghcr.io/kuberik/charts/kuberik" \
               --version "$version" >/dev/null 2>&1; then
            echo "kuberik chart $version already pushed to OCI; skipping"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          helm push "/tmp/cr/kuberik-${version}.tgz" oci://ghcr.io/kuberik/charts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Verify OCI artifact is pullable
        # After push, immediately pull the chart back and helm template it
        # to confirm the OCI artifact is well-formed and reachable from a
        # fresh client. Catches publish-but-corrupt regressions.
        run: |
          set -euo pipefail
          version=${{ steps.oci-push.outputs.version }}
          mkdir -p /tmp/verify
          helm pull oci://ghcr.io/kuberik/charts/kuberik \
            --version "$version" --destination /tmp/verify
          test -s "/tmp/verify/kuberik-${version}.tgz"
          helm template oci-verify "/tmp/verify/kuberik-${version}.tgz" \
            > /tmp/verify/render.yaml
          grep -q '^kind: Deployment' /tmp/verify/render.yaml
