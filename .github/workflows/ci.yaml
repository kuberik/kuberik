name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v3
      - name: Build install manifest
        run: kustomize build config/install > /tmp/install.yaml
      - name: Validate YAML
        run: |
          test -s /tmp/install.yaml
          head -50 /tmp/install.yaml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint chart/kuberik
      - name: Render chart (defaults)
        run: helm template kuberik chart/kuberik > /tmp/kuberik-default.yaml
      - name: Render chart (all integrations + dashboard)
        run: |
          helm template kuberik chart/kuberik \
            --set integrations.datadog.enabled=true \
            --set integrations.prometheus.enabled=true \
            --set integrations.openkruise.enabled=true \
            --set integrations.environment.enabled=true \
            --set dashboard.enabled=true \
            > /tmp/kuberik-all.yaml
      - name: Validate rendered output with kubeval-style check
        run: |
          # Count top-level kinds to confirm dashboard + integrations rendered
          grep -c "^kind: Deployment" /tmp/kuberik-all.yaml | grep -q "^5$" || \
            { echo "expected 5 Deployments (rollout + 3 integrations + dashboard)"; exit 1; }
      - name: Validate output is non-empty
        run: |
          test -s /tmp/kuberik-default.yaml
          test -s /tmp/kuberik-all.yaml

  helm-install-kind:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [defaults, integrations]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kuberik-helm-${{ matrix.profile }}
      - name: Install chart (${{ matrix.profile }})
        # Use --create-namespace and disable the chart's namespace template
        # so the two do not collide. The "integrations" profile enables
        # datadog, openkruise, environment, and dashboard so all
        # vendored deployments are exercised on a kind cluster.
        run: |
          extra_flags=""
          if [[ "${{ matrix.profile }}" == "integrations" ]]; then
            extra_flags="--set integrations.datadog.enabled=true \
              --set integrations.openkruise.enabled=true \
              --set integrations.environment.enabled=true \
              --set dashboard.enabled=true"
          fi
          helm install kuberik chart/kuberik \
            --namespace kuberik-system --create-namespace \
            --set createNamespace=false \
            $extra_flags \
            --wait --timeout 5m
      - name: Verify rollout-controller is Available
        run: |
          kubectl wait --for=condition=Available --timeout=120s \
            -n kuberik-system deployment/rollout-controller
      - name: Run helm test
        run: helm test kuberik --namespace kuberik-system --timeout 3m
      - name: Apply chart sample manifests
        # Confirm the CRDs the chart installed actually accept the
        # sample manifests the chart ships in samples/. The samples
        # declare metadata.namespace: default, so apply in-place.
        run: |
          set -euo pipefail
          kubectl apply -f chart/kuberik/samples/rollout.yaml
          kubectl apply -f chart/kuberik/samples/gate.yaml
          kubectl apply -f chart/kuberik/samples/schedule.yaml
          kubectl apply -f chart/kuberik/samples/healthcheck.yaml
          kubectl get rollout,rolloutgate,rolloutschedule,healthcheck -n default

      - name: Apply repo examples
        # Validates the user-facing examples render against the chart's CRDs.
        # The chart's crds/ dir installs every Kuberik CRD (including
        # environments.kuberik.com from the openkruise/environment
        # integrations), so we can validate them all without enabling
        # the integration controllers. with-datadog/with-prometheus need
        # third-party CRDs that we do not ship and are skipped here.
        run: |
          set -euo pipefail
          for ns in production staging; do
            kubectl create namespace "$ns" --dry-run=client -o yaml | kubectl apply -f -
          done
          kubectl apply -f examples/basic-rollout/rollout.yaml
          kubectl apply -f examples/with-gate/gate.yaml
          kubectl apply -f examples/with-schedule/schedule.yaml
          kubectl apply -f examples/with-schedule/freeze.yaml
          kubectl apply -f examples/with-environments/environments.yaml
          kubectl get rollout,rolloutgate,rolloutschedule,clusterrolloutschedule,environment -A | \
            grep -E 'my-app|business-hours|christmas-freeze|staging|production'
      - name: Verify helm uninstall is clean
        # Uninstall should leave no Deployments or Services in
        # kuberik-system (CRDs intentionally remain - that's Helm's
        # crds/ contract). Existing CRs survive too, which is fine.
        run: |
          set -euo pipefail
          helm uninstall kuberik --namespace kuberik-system --wait --timeout 2m
          if kubectl get deployment -n kuberik-system 2>/dev/null | grep -v 'No resources'; then
            echo "expected no Deployments after uninstall"
            exit 1
          fi
          # CRDs still here - that's correct.
          kubectl get crd | grep kuberik.com
      - name: Show installed resources
        if: always()
        run: |
          kubectl get all -n kuberik-system
          kubectl get crd | grep kuberik

  helm-upgrade-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kuberik-upgrade
      - name: Install latest released chart
        run: |
          helm repo add kuberik https://kuberik.github.io/kuberik
          helm repo update
          helm install kuberik kuberik/kuberik \
            --namespace kuberik-system --create-namespace \
            --set createNamespace=false \
            --wait --timeout 3m
      - name: Upgrade to in-tree chart
        run: |
          helm upgrade kuberik chart/kuberik \
            --namespace kuberik-system \
            --set createNamespace=false \
            --wait --timeout 3m
      - name: Verify rollout-controller is still Available
        run: |
          kubectl wait --for=condition=Available --timeout=120s \
            -n kuberik-system deployment/rollout-controller
      - name: Run helm test
        run: helm test kuberik --namespace kuberik-system --timeout 3m
      - name: Show installed resources
        if: always()
        run: |
          kubectl get all -n kuberik-system
          helm history kuberik -n kuberik-system
